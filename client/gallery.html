<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>그림 확인</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1b1f27;
        color: #e8e2d4;
        font: 13px "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        padding: 8px 12px;
        background: #11141a;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      nav a {
        color: #d8ad3d;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- 개발용: 유닛·건물 그림을 한 화면에 모아 본다 (npm run dev → /gallery.html). 배포 빌드에는 들어가지 않는다 -->
    <nav id="nav"></nav>
    <canvas id="gallery"></canvas>
    <script type="module" src="/src/dev/gallery.js"></script>
  </body>
</html>
